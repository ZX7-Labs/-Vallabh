name: Sanitized private test diagnostic
on:
  push:
    branches: [main]
    paths: ["RUN_DEBUG"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve private revision
        id: target
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          repo="${PRIVATE_REPOSITORY:-ZX7-Labs/ai-product-web}"
          branch="$(tr -d '\r\n' < VERIFY_BRANCH)"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          line="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote "https://github.com/${repo}.git" "refs/heads/${branch}" 2>"$RUNNER_TEMP/resolve-private.log")"
          sha="$(printf '%s\n' "$line" | awk 'NR==1 {print $1}')"
          bash scripts/validate-input.sh "$sha"
          echo "value=$sha" >> "$GITHUB_OUTPUT"
          echo "PRIVATE_SHA=$sha"
      - name: Exact private checkout
        env:
          TARGET_SHA: ${{ steps.target.outputs.value }}
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-private.sh
      - name: Report only sanitized failing Rust test identifiers
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update >/dev/null 2>&1
          set +e
          (cd "$RUNNER_TEMP/private-source" && cargo +1.98.1 test --workspace --locked) >"$RUNNER_TEMP/private-tests-debug.log" 2>&1
          rc=$?
          set -e
          echo "TEST_EXIT_CODE=$rc"
          if [[ "$rc" != "0" ]]; then
            awk '
              /^failures:$/ { block=1; next }
              /^test result:/ { block=0 }
              block && /^    [[:alnum:]_:]+$/ {gsub(/ /,"",$0);print "FAILED_TEST="$0}
            ' "$RUNNER_TEMP/private-tests-debug.log" | sort -u
          fi
          exit 0
